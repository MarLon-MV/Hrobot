# Parámetros Nav2 (ROS 2 Jazzy) para el AMR hospitalario.
# Frames REP-105: map -> odom -> base_link -> laser. Tópicos: /scan, /odom.
# Solo se incluyen parámetros conocidos; el resto usa los valores por defecto de Nav2.
# NO validado contra una instalación real de Nav2: ver "Verificación humana" de TASK-007.
# Remapeo de /cmd_vel: fuera de alcance (TASK-009).

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: /scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    set_initial_pose: false  # la pose inicial se fija con RViz (SetInitialPose)
    # TODO(verify): alpha1..alpha5, laser_max_range, min/max_particles según el robot real

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    # TODO(verify): plugin_lib_names y árboles de comportamiento (se usan los por defecto)

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # Robot diferencial, sin marcha atrás ni movimiento lateral.
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.25
      max_vel_y: 0.0
      max_vel_theta: 0.8
      # TODO(verify): acc_lim_*, decel_lim_*, critics y escalas de trayectoria (calibrar con el robot)

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"  # TODO(verify): nombre del plugin en Jazzy

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.17
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      robot_radius: 0.17
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""  # el mapa se pasa por launch (TASK-009)

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odom
    # [x, y, theta] en m/s, m/s, rad/s
    max_velocity: [0.3, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]  # TODO(verify): min_velocity[0] = 0.0 evita marcha atrás
    # TODO(verify): max_accel, max_decel, smoothing_frequency, feedback

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["map_server", "amcl"]

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["controller_server", "planner_server", "velocity_smoother", "bt_navigator"]
    # TODO(verify): añadir behavior_server / smoother_server / waypoint_follower si se usan
