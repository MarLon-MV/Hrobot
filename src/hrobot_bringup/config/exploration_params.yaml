# Parametros de exploration_node (TASK-027). Unidades: metros, segundos.
exploration_node:
  ros__parameters:
    min_frontier_size: 8            # celdas por frontera # TODO(verify): ajustar al ruido real del LD19
    blacklist_radius: 0.5           # m # TODO(verify): segun radio del robot y pasillos
    min_goal_distance: 0.4          # m # TODO(verify): segun tolerancia del controlador
    exploration_period_s: 2.0       # s entre ciclos de seleccion de frontera
    max_consecutive_failures: 5     # objetivos fallidos seguidos antes de abortar
    no_frontier_confirmations: 3    # ciclos sin fronteras para dar por terminada la exploracion
    map_save_name: "map"            # el launch lo sobrescribe con <share>/hrobot_bringup/maps/map
    map_save_timeout_s: 10.0        # s # TODO(verify): depende del tamano del mapa
    create3_namespace: "/r2"        # namespace del Create 3 (dock_status, kidnap_status, ...)
    undock_timeout_s: 30.0          # s para confirmar docked == false tras pedir undock # TODO(verify)
    status_timeout_s: 10.0          # s esperando dock_status antes de abortar; antigüedad máxima de dock/kidnap/battery (caducado = desconocido)
    kidnap_clear_cycles: 3          # ciclos consecutivos sin secuestro para reanudar
    min_battery_pct: 20.0           # % bajo el cual se guarda el mapa parcial y se termina # TODO(verify)

# map_saver_server (nav2_map_server): expone /map_saver/save_map.
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

lifecycle_manager_map_saver:
  ros__parameters:
    autostart: true
    node_names: ["map_saver"]
