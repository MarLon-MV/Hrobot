# Parámetros slam_toolbox (modo mapeo). Frames REP-105; tópico /scan.
# NO validado contra una instalación real: ver "Verificación humana" de TASK-007.
slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    do_loop_closing: true
    resolution: 0.05
    max_laser_range: 12.0  # TODO(verify): alcance nominal LD19 según datasheet
