# slam_toolbox online_async (mapping) voor Create 3 + SLAMTEC RPLIDAR C1.
# De node heet `slam_toolbox` (gestart als async_slam_toolbox_node, name='slam_toolbox').
#
# map_file_name / map_start_at_dock worden hier bewust NIET ingesteld: slam.launch.py voegt
#   map_file_name: <maps_dir>/<map>   (basispad ZONDER extensie; laadt <map>.posegraph + .data)
#   map_start_at_dock: true
# alleen toe bij map:=<naam>, om een bestaande kaart uit te breiden. Zonder map:= start een nieuwe kaart.
slam_toolbox:
  ros__parameters:
    # Solver (Ceres)
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: scan          # relatief: /<ns>/scan
    mode: mapping            # mapping (geen localization): de robot blijft de kaart uitbreiden

    debug_logging: false
    throttle_scan: 1         # RPLIDAR C1 levert ~10 Hz; verwerk elke scan (verhoog als de RPi5-CPU verzadigt)
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    # Datasheet RPLIDAR C1: bereik 0,05-12 m (wit object, 90% reflectie). max_laser_range staat op de
    # sensorlimiet; metingen daarboven worden voor het raster afgekapt, dus een hogere waarde dan het
    # echte bereik voegt alleen ruis toe.
    max_laser_range: 12.0
    # Negeer metingen van de robotromp / RPLIDAR C1-behuizing (de lidar zit boven de basis).
    min_laser_range: 0.10
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000   # bytes; nodig om grote pose graphs te (de)serialiseren
    enable_interactive_mode: false

    # Algemene parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2    # m tussen verwerkte scans (klein voor een robot met 0,17 m straal)
    minimum_travel_heading: 0.2     # rad (~11 deg)
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlatieparameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlatieparameters voor loop closure
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Parameters van de scan matcher
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
